name: Deploy

on:
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    permissions:
      id-token: write 
      contents: read  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308740035407:role/titan-github-actions-role 
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: titan-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -eux
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          echo "ECR_REPOSITORY=$ECR_REPOSITORY"
          echo "IMAGE_TAG=$IMAGE_TAG"

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          # Write the output and show it for debugging
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "WROTE GITHUB_OUTPUT:"
          tail -n +1 $GITHUB_OUTPUT || true

  deploy:
    name: Deploy to EKS Cluster
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308740035407:role/titan-github-actions-role 
          aws-region: eu-central-1

      - name: Set up kubectl
        run: aws eks update-kubeconfig --region eu-central-1 --name titan-eks-cluster

      - name: Resolve image to deploy (fallback from ECR)
        id: resolve-image
        env:
          AWS_REGION: eu-central-1
          REPO: titan-api
        run: |
          set -eux
          # Prefer the job output from the build-and-push job
          IMAGE="${{ needs.build-and-push.outputs.image }}"
          echo "Image from job output: '$IMAGE'"

          if [ -z "$IMAGE" ]; then
            echo "Job output empty — querying ECR for latest image tag..."
            LATEST_TAG=$(aws ecr describe-images --repository-name "$REPO" \
              --region $AWS_REGION \
              --query 'sort_by(imageDetails,& imagePushedAt)[-1].imageTags[0]' \
              --output text)
            if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "None" ]; then
              echo "No image tag found in ECR for $REPO" >&2
              exit 1
            fi
            ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
            IMAGE="${ACCOUNT}.dkr.ecr.${AWS_REGION}.amazonaws.com/${REPO}:${LATEST_TAG}"
            echo "Resolved image from ECR: $IMAGE"
          fi

          echo "deploy_image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to EKS
        run: |
          echo "Deploy image: '${{ steps.resolve-image.outputs.deploy_image }}'"
          if [ -z "${{ steps.resolve-image.outputs.deploy_image }}" ]; then
            echo "Error: resolved image is empty. Cannot deploy." >&2
            exit 1
          fi

          sed -i "s|DOCKER_IMAGE_PLACEHOLDER|${{ steps.resolve-image.outputs.deploy_image }}|" k8s/deployment.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/titan-api-deployment --timeout=180s

