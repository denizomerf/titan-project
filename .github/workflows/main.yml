name: Titan CI/CD Pipeline 

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    permissions:
      id-token: write 
      contents: read  

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::308740035407:role/titan-github-actions-role 
          aws-region: eu-central-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: titan-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy to EKS Cluster
    needs: build-and-push
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::308740035407:role/titan-github-actions-role 
          aws-region: eu-central-1

      - name: Set up kubectl
        run: aws eks update-kubeconfig --region eu-central-1 --name titan-eks-cluster

      - name: Deploy to EKS
        run: |
          echo "Built image: '${{ needs.build-and-push.outputs.image }}'"
          if [ -z "${{ needs.build-and-push.outputs.image }}" ]; then
            echo "Error: built image output is empty. Build step may have failed to set the output." >&2
            exit 1
          fi

          # Use kubectl set image to avoid modifying files and cause of invalid manifest when image is empty
          kubectl apply -f k8s/
          kubectl set image deployment/titan-api-deployment titan-api-container=${{ needs.build-and-push.outputs.image }} --record

